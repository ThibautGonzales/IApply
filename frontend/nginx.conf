server {
  listen 80;
  root /usr/share/nginx/html;

  # Forward API calls to the backend service; the trailing slash strips the /api prefix.
  location /api/ {
    proxy_pass http://backend:8000/;
    # A collection scores the new offers with the LLM, which can take minutes (60 s by default).
    proxy_read_timeout 600s;
  }

  # Let Angular handle its own routes (deep links fall back to index.html).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
