<h2>{{ i18n.t('profile.title') }}</h2>
<p>{{ i18n.t('profile.help') }}</p>

@if (profile(); as profile) {
  <textarea
    #text
    rows="12"
    [value]="profile.looking_for"
    [placeholder]="i18n.t('profile.placeholder')"
    (input)="saved.set(false)"
  ></textarea>
  <label class="threshold">
    {{ i18n.t('profile.minScore') }}
    <input
      #minScore
      type="number"
      min="0"
      max="100"
      [value]="profile.min_score"
      (input)="saved.set(false)"
    />
  </label>
  <small>{{ i18n.t('profile.minScoreHelp') }}</small>
  <div class="buttons">
    <button type="button" (click)="save(text.value, minScore.valueAsNumber)" [disabled]="saving()">
      {{ i18n.t('profile.save') }}
    </button>
    @if (saved()) {
      <span class="saved">
        {{ i18n.t('profile.saved') }} {{ profile.updated_at | date: 'short' }}
      </span>
    }
  </div>
}
