<section>
  <h2>{{ i18n.t('jobs.title') }}</h2>

  <button type="button" (click)="collect()" [disabled]="collecting()">
    {{ collecting() ? i18n.t('collect.running') : i18n.t('collect.button') }}
  </button>
  @if (message()) {
    <p class="message">{{ message() }}</p>
  }

  <h3>{{ i18n.t('jobs.onSite') }} ({{ onSiteJobs().length }})</h3>
  <app-job-table
    class="on-site"
    [jobs]="onSiteJobs()"
    (hide)="hide($event)"
    (apply)="apply($event)"
    (saved)="replace($event)"
  />

  <h3>{{ i18n.t('jobs.remote') }} ({{ remoteJobs().length }})</h3>
  <app-job-table
    class="remote"
    [jobs]="remoteJobs()"
    (hide)="hide($event)"
    (apply)="apply($event)"
    (saved)="replace($event)"
  />
</section>
