<app-page-header
  number="01"
  [tagline]="adding() ? i18n.t('add.tagline') : i18n.t('jobs.tagline')"
  [heading]="i18n.t('jobs.title')"
  [subtitle]="adding() ? '' : i18n.t('jobs.subtitle')"
>
  <div class="header-buttons">
    <button
      type="button"
      class="btn open"
      [attr.aria-expanded]="adding()"
      (click)="adding.set(!adding())"
    >
      {{ adding() ? '–' : '+' }} {{ i18n.t('add.open') }}
    </button>
    <button
      type="button"
      class="btn btn-primary collect"
      (click)="collect()"
      [disabled]="collecting()"
    >
      {{ collecting() ? i18n.t('collect.running') : i18n.t('collect.button') }}
    </button>
  </div>
  @if (message()) {
    <p class="collect-result" [class.error]="collectError()">{{ message() }}</p>
  }
</app-page-header>

@if (adding()) {
  <app-add-offer (added)="add($event)" (closed)="adding.set(false)" />
}

<section>
  <div class="section-title">
    <h2>{{ i18n.t('jobs.onSite') }}</h2>
    <span class="count">{{ onSiteJobs().length }}</span>
    <small class="hint">{{ i18n.t('jobs.scoreNote') }}</small>
  </div>
  <app-job-table
    class="on-site"
    [jobs]="onSiteJobs()"
    (hide)="hide($event)"
    (apply)="apply($event)"
    (saved)="replace($event)"
  />
</section>

<section>
  <div class="section-title">
    <h2>{{ i18n.t('jobs.remote') }}</h2>
    <span class="count">{{ remoteJobs().length }}</span>
  </div>
  <app-job-table
    class="remote"
    [jobs]="remoteJobs()"
    (hide)="hide($event)"
    (apply)="apply($event)"
    (saved)="replace($event)"
  />
</section>

<p class="hint">{{ i18n.t('jobs.footer') }}</p>
