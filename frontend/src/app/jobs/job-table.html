@if (jobs().length) {
  <table>
    <thead>
      <tr>
        <th i18n="@@tablePublished">Published</th>
        <th i18n="@@tableTitle">Title</th>
        <th i18n="@@tableCompany">Company</th>
        <th i18n="@@tableLocation">Location</th>
        <th i18n="@@tableContract">Contract</th>
      </tr>
    </thead>
    <tbody>
      @for (job of jobs(); track job.id) {
        <tr>
          <td>{{ job.published_at | date: 'dd/MM/yyyy' }}</td>
          <td>
            <a [href]="job.url" target="_blank" rel="noopener">{{ job.title }}</a>
          </td>
          <td>{{ job.company }}</td>
          <td>{{ job.location }}</td>
          <td>{{ job.contract_type }}</td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p i18n="@@noOffers">No offers yet.</p>
}
